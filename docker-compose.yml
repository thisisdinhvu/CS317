version: "3.9"

services:
  diabetes-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    container_name: cs317-diabetes_api
    depends_on:
      - prometheus
    volumes:
      - ./logging:/logging
      # - ./logging:/app/logs
    logging:
      driver: "json-file"

  prometheus:
    image: prom/prometheus
    container_name: cs317-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle" 
    ports:
      - "9090:9090"
    restart: always

  alertmanager:
    image: prom/alertmanager
    container_name: cs317-alertmanager
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml  
    command:
      - "--config.file=/etc/alertmanager/config.yml"
    ports:
      - "9093:9093"
    restart: always


  grafana:
    image: grafana/grafana
    container_name: cs317-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: always


  node_exporter:
    image: prom/node-exporter
    container_name: cs317-node_exporter
    ports:
      - "9100:9100"
    restart: always

  loki:
    image: grafana/loki:2.9.0
    container_name: cs317-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - ./loki/data:/loki        
    command: -config.file=/etc/loki/local-config.yaml
    restart: always

  # promtail:
  #   image: grafana/promtail:2.9.0
  #   container_name: cs317-promtail
  #   volumes:
  #     - ./logging:/app/logs:ro                 
  #     - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
  #     - promtail_positions:/tmp  
  #   command: -config.file=/etc/promtail/promtail-config.yaml
  #   depends_on:
  #     - loki
  #   user: root

  promtail:
    image: grafana/promtail:2.9.0
    container_name: cs317-promtail
    restart: always
    user: root
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./logging:/logging:ro                        # <-- api.log
      - promtail_positions:/tmp                      # <-- positions.yaml
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/log:/var/log:ro                         # <-- syslog
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  promtail_positions:
